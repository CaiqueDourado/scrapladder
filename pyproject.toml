[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapladder"
version = "0.1.0"
description = "Fetch web pages by climbing a ladder of methods (HTTP, browser TLS fingerprint, headless browsers, scraping APIs), learning per domain which rung works."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Caique Dourado"}]
requires-python = ">=3.10"
dependencies = []
keywords = ["web-scraping", "crawler", "anti-bot", "curl_cffi", "playwright", "camoufox", "scrapling"]

[project.optional-dependencies]
http = ["requests>=2.28", "httpx>=0.25"]
curl = ["curl_cffi>=0.7"]
browser = ["playwright>=1.40"]
camoufox = ["camoufox>=0.4"]
scrapling = ["scrapling>=0.2"]
all = ["requests>=2.28", "httpx>=0.25", "curl_cffi>=0.7", "playwright>=1.40"]
dev = ["pytest>=7"]

[project.scripts]
scrapladder = "scrapladder.cli:main"

[project.urls]
Homepage = "https://github.com/CaiqueDourado/scrapladder"

[tool.setuptools.packages.find]
where = ["src"]
